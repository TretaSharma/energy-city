    <div class="ant" aria-hidden="true"><i></i><i></i></div>
    <div class="tv-body">
      <div class="screen k-${e.k || 'none'} ${fresh ? 'flash' : ''}" aria-live="polite">
        <span class="bug">ECN</span><span class="live">● LIVE</span>
        <div class="band">${band}</div>
        <div class="hl">${esc(e.h || e.t)}</div>
        ${e.h ? `<div class="sub">${esc(e.t)}</div>` : ''}
        ${older ? `<div class="ticker"><span>${older}  ✦  ${older}</span></div>` : ''}
      </div>
      <div class="panel-r" aria-hidden="true"><i></i><i></i><span class="spk"></span></div>
    </div>
    <div class="legs" aria-hidden="true"><i></i><i></i></div>
  </section>`;
}


const KIND_LABEL = { clean: 'Clean energy', power: 'Power', dirty: 'Dirty energy', crisis: 'Trouble!', shield: 'Protection', ai: '> data center', steal: 'Sneaky move' };
function cardView(id, res, tone, who, ch, back) {
  const c = CARDS[id];
  const bg = { good: 'var(--good)', bad: 'var(--rose)', mixed: '#b9852a', shield: 'var(--teal)' }[tone] || 'var(--good)';
  return `<div class="card ${back ? 'is-back' : ''}" role="dialog" aria-label="${esc(c.name)}">
    <div class="band ${c.kind}">${KIND_LABEL[c.kind]}</div>
    ${back ? '<div class="backtag">↩ Back into the deck</div>' : ''}
    ${who ? `<div class="by">${esc(who)} drew</div>` : ''}
    <div class="ttl">${esc(c.name)}</div>
    <div class="pic ${c.kind}">${ico(c.icon)}${c.kind === 'clean' ? star('star') : ''}</div>
    <div class="fx">${esc(c.fx)}</div>
    <div class="nt">${esc(c.note)}</div>
    ${res ? `<div class="res" style="background:${bg}">${esc(res)}</div>` : '<div style="height:14px"></div>'}
    ${ch && ch.length ? `<ul class="changes" aria-label="What changed">${ch.map(c => `<li class="${c.d > 0 ? 'good' : 'bad'}">${c.d > 0 ? '▲' : '▼'} ${esc(c.text)}</li>`).join('')}</ul><div style="height:12px"></div>` : ''}
  </div>`;
}

function overlayView() {
  const o = ui.overlay;
  if (o.type === 'card') return `<div class="ov" role="dialog" aria-modal="true"><div class="stack">${cardView(o.id, o.res, o.tone, o.who, o.ch, o.back)}
    ${o.bot ? '' : `<button class="btn rose" data-a="closecard" id="card-ok">${o.pending === 'envy' ? 'Pick a rival' : o.pending === 'insure' ? 'Protect a building' : 'OK'}</button>`}</div></div>`;
  if (o.type === 'pass') { const p = cur(); return `<div class="ov"><div class="modal" style="text-align:center"><h2>${esc(p.name)}, it’s your turn!</h2>
    <p>${badge(p, G.cur)}</p><p>Your map has the rose outline.</p>
    <button class="btn rose" data-a="ready" id="ready" style="margin-top:10px">I’m ready</button></div></div>`; }
  if (o.type === 'steal') {
    const p = cur(), envy = o.mode === 'envy'; const opts = stealTargets(p);
    return `<div class="ov" role="dialog" aria-modal="true"><div class="modal"><h2>${envy ? 'Envy Country' : 'Power Grab'}</h2><p>${envy ? 'Take up to 4 ⚡ from one rival. It goes straight into your Data Center.' : 'Take up to 3 ⚡ that one rival hasn’t placed yet.'} Theft Insurance blocks you.</p>
      <div class="seats">${opts.map(x => `<button class="btn" data-steal="${G.players.indexOf(x)}" style="text-align:left;display:flex;gap:10px;align-items:center">${badge(x, G.players.indexOf(x))} ${esc(x.name)}: ${x.bank} ⚡ to place${x.theft ? ' · has Theft Insurance' : ''}</button>`).join('')}</div></div></div>`;
  }
  if (o.type === 'help') return `<div class="ov" role="dialog" aria-modal="true"><div class="modal"><h2>How to play</h2>${helpSteps()}<button class="btn rose" data-a="closeov">Let’s build!</button></div></div>`;
  if (o.type === 'confirmnew') return `<div class="ov" role="dialog" aria-modal="true"><div class="modal"><h2>Start a new game?</h2><p>This city will be lost.</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn rose" data-a="reallynew">New game</button><button class="btn" data-a="closeov">Keep playing</button></div></div></div>`;
  if (o.type === 'end') {
    const w = G.players[G.winner];
    const rows = G.players.map((x, i) => `<tr><td>${esc(x.name)}</td><td>${x.stats.clean}</td><td>${x.stats.dirty}</td><td>${x.stats.lost}</td><td>${online(x)}/${RACKS}</td><td>${x.finished ? '✓' : '–'}</td></tr>`).join('');
    return `<div class="ov" role="dialog" aria-modal="true"><div class="modal">${star('doodle-in')}<h2>${esc(w.name)} powered the whole city!</h2>
      <p>All 8 buildings and the Data Center are online.${G.players.filter(x => x.finished).length > 1 ? ' More than one city finished, so the one built with the most clean power wins.' : ''} Here’s the Engineer’s Report:</p>
      <div style="overflow-x:auto"><table class="report"><thead><tr><th>Mayor</th><th>Clean ⚡</th><th>Dirty ⚡</th><th>Lost</th><th>Data Center</th><th>Finished</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p style="font-family:var(--round);margin-top:14px">Talk it over</p>
      <ul style="margin:4px 0 16px;padding-left:20px;font-weight:600">
        <li>Was Nuclear or Diesel power worth it? When was it a bad idea?</li>
        <li>The Data Center needed as much power as four houses. Where should the electricity for AI come from?</li>
        <li>Which layout would you try next time so every building fits?</li>
      </ul>
      <button class="btn rose" data-a="again">Play again</button></div></div>`;
  }
  return '';
}

function helpSteps() {
  return `<ol class="steps">
    <li>${bolt('ico')}<span><b>Everyone starts with ${START_BANK} generators.</b> Each turn your power plant adds ${INCOME}, then you draw 1 card from the Energy Deck everyone shares. Most cards give generators. Some bring trouble, like Protests and smoke. Some are sneaky: Power Grab takes generators a rival hasn’t placed yet, and Theft Insurance stops it.</span></li>
    <li>${ico('house')}<span><b>Place your first House to start.</b> Drag a building onto an empty lot (or tap it, then tap a lot). Place the rest whenever you like, even mid-game, and drag buildings on the map to move or swap them. Drag a ⚡ onto a building, or tap the building, to power it. House 2 · School 4 · Factory 6 · Hospital 8.</span></li>
    <li>${ico('factory')}<span><b>Follow the city rules.</b> Schools and Hospitals need clean air, so keep them away from Factories. A Hospital also needs a House next door.</span></li>
    <li><svg class="ico" viewBox="0 0 48 48"><use href="#i-bot"/></svg><span><b>Power the Data Center.</b> Out past the highway sits your city’s Data Center. It runs AI, and AI needs a lot of electricity: 4 server racks, 2 generators each.</span></li>
    <li>${star('ico')}<span><b>Win</b> by powering all 8 buildings and all 4 server racks. When someone finishes, everyone else gets one last turn. If more than one city finishes, the one built with the most clean power wins.</span></li>
  </ol>`;
}

function setupView() {
  const s = ui.setup || (ui.setup = defaultSetup());
  const cpu = s.mode === 'cpu';
  const field = (i, label) => `<label class="namefield"><span>${label}</span><input id="name-${i}" value="${esc(s.names[i])}" maxlength="14" placeholder="Mayor ${i + 1}" autocomplete="off" data-name="${i}"></label>`;
  return `<div class="setup"><div class="hero"><div class="logo">${bolt()}Energy <em>City</em></div><p>Build a city. Power it up. Light up the Data Center. <span>Don’t blow a fuse.</span></p></div>
  <div class="layout">
    <section class="paper"><h3>How do you want to play?</h3>
      <div class="modes" role="radiogroup" aria-label="Game mode">
        <button class="mode ${cpu ? 'on' : ''}" data-mode="cpu" role="radio" aria-checked="${cpu}"><svg class="ico" viewBox="0 0 48 48"><use href="#i-bot"/></svg><b>Me vs the computer</b><small>You build your city. Volt Bot builds its own.</small></button>
        <button class="mode ${cpu ? '' : 'on'}" data-mode="duo" role="radio" aria-checked="${!cpu}"><span class="two">${ico('house')}${ico('house')}</span><b>2 players, same screen</b><small>Take turns on one screen. Both maps side by side.</small></button>
      </div>
      <div class="names">${cpu ? field(0, 'Your name') : field(0, 'Player 1 name') + field(1, 'Player 2 name')}</div>
      <label class="tutopt"><input type="checkbox" id="tut-opt" data-tutopt ${s.tut ? 'checked' : ''}> Show me how to play, step by step</label>
      <button class="btn rose big" data-a="start">Start building</button>
    </section>
    <section class="paper"><h3>How to play</h3>${helpSteps()}</section>
  </div></div>`;
}

// ---------- matrix rain behind the Data Center ----------
const mxCanvas = document.createElement('canvas');
mxCanvas.setAttribute('aria-hidden', 'true');
const MX_GLYPHS = '01アイウエオカキクケコサシスセソ⚡01<>{}';
let mxDrops = [], mxLast = 0;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function mxFrame(ts) {
  requestAnimationFrame(mxFrame);
  if (!mxCanvas.isConnected || ts - mxLast < 60) return;
  mxLast = ts;
  const r = mxCanvas.parentElement.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(r.width), h = Math.round(r.height), fs = 15;
  const ctx = mxCanvas.getContext('2d');
  if (mxCanvas.width !== w * dpr || mxCanvas.height !== h * dpr) {
    mxCanvas.width = w * dpr; mxCanvas.height = h * dpr; ctx.scale(dpr, dpr);
    mxDrops = Array.from({ length: Math.ceil(w / fs) }, () => Math.random() * -h / fs);
  }
  ctx.fillStyle = 'rgba(6,21,13,0.16)'; ctx.fillRect(0, 0, w, h);
  ctx.font = `${fs}px VT323, monospace`;
  mxDrops.forEach((y, i) => {
    const ch = MX_GLYPHS[Math.floor(Math.random() * MX_GLYPHS.length)];
    ctx.fillStyle = Math.random() < 0.08 ? '#c9ffdc' : '#1f8f52';
    ctx.fillText(ch, i * fs, y * fs);
    mxDrops[i] = y * fs > h && Math.random() > 0.97 ? 0 : y + (reduceMotion ? 0 : 1);
  });
}
requestAnimationFrame(mxFrame);

// ---------- first-game tutorial ----------
// Coach bubbles point at the thing to tap. Action steps move on when the player does them.
const TUT_KEY = 'ec-tutorial-done';
function tutDone() { try { return localStorage.getItem(TUT_KEY) === '1'; } catch (e) { return false; } }
function tutFinish(skipped) {
  try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {}
  ui.tut = null; $('#tut').innerHTML = '';
  if (!skipped) toast('Tutorial done! You’re ready, Mayor.');
}
const TUT_STEPS = [
  { at: '.map.active .map-top', title: 'Welcome, Mayor!', next: 'OK',
    text: () => 'This is your city map. Your job: power every building downtown, and the Data Center at the edge of town. Your rival builds their own city on the map below, with the same cards and the same weather. Let’s build your first House!' },
  { at: '.map.active', free: true, title: 'Place your first House',
    text: () => 'Every city starts with a House. Drag the House from the list under your map onto any empty lot downtown. (You can also tap House, then tap a lot.)',
    done: p => hasHouse(p) },
  { at: '.map.active .rules', title: 'City rules', next: 'OK',
    text: () => 'Schools and Hospitals need clean air, so they can’t go next to a Factory. A Hospital also needs a House next door. Next to means left, right, up or down.' },
  { at: '.table', title: 'Get some power',
    text: () => `Your first House is down, so the deck is open! You start with ${START_BANK} generators. Each turn your power plant adds ${INCOME} more, and you draw 1 card. Most cards give power, some bring trouble, and some let you grab power from a rival. Tap the deck!`,
    done: () => G.actions < DRAWS },
  { at: '.tv', title: 'Watch the news', next: 'OK',
    text: () => 'Every card you or your rivals draw is announced on Energy City News.' },
  { at: '.map.active', free: true, title: 'Power your building',
    text: p => p.bank > 0 ? 'See “⚡ to place” at the top of your map? Those are your generators. Drag one onto your House, or just tap the House. Fill it up to light it up!' : 'You have no generators to place yet. Draw another card to get some.',
    done: p => p.grid.some(b => b && b.gens > 0) || (G.actions === 0 && p.bank === 0) },
  { at: '.map.active .palette', title: 'Build the rest', next: 'OK',
    text: () => 'Drag the rest of your buildings onto your map whenever you like: 4 Houses, 2 Factories, 1 School and 1 Hospital. Changed your mind? Drag a building on the map to a new spot.' },
  { at: '.map.active .dc', title: 'The Data Center', next: 'OK',
    text: () => 'Out past the highway is your Data Center. It runs AI, and AI needs a lot of electricity: 8 generators. Drag a ⚡ onto a server rack, or tap it, to power it. You need it to win!' },
  { at: '[data-a="end"]', title: 'End your turn',
    text: () => 'Done for this turn? Tap End turn and the next mayor goes. Generators you don’t place stay in “to place” for next turn.',
    done: () => ui.tut && ui.tut.ended },
];

function tutAnchor(step) { return typeof step.at === 'function' ? step.at() : $(step.at); }

function tutRender() {
  const box = $('#tut');
  const t = ui.tut;
  if (!t || !G) { box.innerHTML = ''; return; }
  const p = G.players[t.who];
  // skip past steps that are already done
  while (t.step < TUT_STEPS.length && TUT_STEPS[t.step].done && TUT_STEPS[t.step].done(p)) t.step++;
  if (t.step >= TUT_STEPS.length) return tutFinish(false);
  if (G.over || ui.overlay || G.cur !== t.who) { box.innerHTML = ''; return; }
  const step = TUT_STEPS[t.step], a = tutAnchor(step);
  if (!a) { box.innerHTML = ''; return; }
  if (step.free) {
    box.innerHTML = `<div class="coach dock" role="dialog" aria-label="Tutorial: ${esc(step.title)}"><div class="sc">Step ${t.step + 1} of ${TUT_STEPS.length}</div>
      <h4>${esc(step.title)}</h4><p>${esc(step.text(p))}</p><div class="row"><button class="skip" data-a="tutskip">Skip tutorial</button></div></div>`;
    t.shown = t.step; return;
  }
  // four blurred panels around the target leave only the target sharp and tappable
  box.innerHTML = `<div class="tut-veil" data-v="t"></div><div class="tut-veil" data-v="b"></div><div class="tut-veil" data-v="l"></div><div class="tut-veil" data-v="r"></div>
  <div class="tut-ring"></div>
  <div class="coach" role="dialog" aria-label="Tutorial: ${esc(step.title)}">
    <div class="sc">Step ${t.step + 1} of ${TUT_STEPS.length}</div>
    <h4>${esc(step.title)}</h4><p>${esc(step.text(p))}</p>
    <div class="row"><button class="skip" data-a="tutskip">Skip tutorial</button>
      ${step.next ? `<button class="btn rose" data-a="tutnext">${esc(step.next)}</button>` : `<span class="doing">Tap the highlighted spot</span>`}</div>
  </div>`;
  if (t.shown !== t.step) {
    t.shown = t.step;
    a.scrollIntoView({ block: 'center', behavior: 'auto' });
  }
  tutPlace();
}

function tutPlace() {
  const b = $('#tut .coach:not(.dock)'), t = ui.tut; if (!b || !t) return;
  const a = tutAnchor(TUT_STEPS[t.step]); if (!a) return;
  const r = a.getBoundingClientRect(), bw = b.offsetWidth, bh = b.offsetHeight, vw = innerWidth, vh = innerHeight;
  const pad = 8, hx = Math.max(0, r.left - pad), hy = Math.max(0, r.top - pad), hr = Math.min(vw, r.right + pad), hb = Math.min(vh, r.bottom + pad);
  const set = (el, x, y, w, h) => { if (el) Object.assign(el.style, { left: x + 'px', top: y + 'px', width: Math.max(0, w) + 'px', height: Math.max(0, h) + 'px' }); };
  set($('#tut [data-v="t"]'), 0, 0, vw, hy);
  set($('#tut [data-v="b"]'), 0, hb, vw, vh - hb);
  set($('#tut [data-v="l"]'), 0, hy, hx, hb - hy);
  set($('#tut [data-v="r"]'), hr, hy, vw - hr, hb - hy);
  set($('#tut .tut-ring'), hx, hy, hr - hx, hb - hy);
  let top = r.bottom + 16, above = false;
  if (top + bh > vh - 12 && r.top - bh - 16 > 12) { top = r.top - bh - 16; above = true; }
  top = Math.max(12, Math.min(vh - bh - 12, top));
  const left = Math.max(12, Math.min(vw - bw - 12, r.left + r.width / 2 - bw / 2));
  b.style.top = top + 'px'; b.style.left = left + 'px';
  b.style.setProperty('--ax', Math.max(22, Math.min(bw - 22, r.left + r.width / 2 - left)) + 'px');
  b.classList.toggle('above', above);
}
let tutRaf = 0;
const tutQueue = () => { cancelAnimationFrame(tutRaf); tutRaf = requestAnimationFrame(tutPlace); };
addEventListener('scroll', tutQueue, { passive: true });
addEventListener('resize', tutQueue);

// ---------- events ----------
function freshUI() { return { fx: [], sel: null, overlay: null, move: null, hit: null, think: '', setup: null }; }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a],[data-cell],[data-rack],[data-pick],[data-move],[data-steal],[data-kind],[data-rm],[data-mode]');
  if (!t) return;
  if (eatClick) return;
  if (t.dataset.move !== undefined) return onMoveBtn(+t.dataset.move, e);
  if (t.dataset.cell !== undefined) return onCell(+t.dataset.cell);
  if (t.dataset.rack !== undefined) return onRack();
  if (t.dataset.pick) return onPick(t.dataset.pick);
  if (t.dataset.steal !== undefined) { if (!G || !['envy', 'grab'].includes(G.pending)) return; const p = cur(), mode = G.pending; ui.overlay = null; doSteal(p, G.players[+t.dataset.steal], mode); return render(); }
  if (t.dataset.mode) { ui.setup.mode = t.dataset.mode; return render(); }
  if (t.dataset.kind) { const [i, k] = t.dataset.kind.split(':'); const seat = ui.setup.seats[+i]; const wasDefault = BOT_NAMES.includes(seat.name) || /^Mayor /.test(seat.name); seat.bot = k === 'b'; if (wasDefault) seat.name = seat.bot ? BOT_NAMES[+i] : `Mayor ${+i + 1}`; return render(); }
  if (t.dataset.rm) { ui.setup.seats.splice(+t.dataset.rm, 1); return render(); }
  const a = t.dataset.a;
  if (a === 'draw') return onDraw();
  if (a === 'end') return onEnd();
  if (a === 'closecard') return closeCard();
  if (a === 'ready' || a === 'closeov') { ui.overlay = null; return render(); }
  if (a === 'help') { ui.overlay = { type: 'help' }; return render(); }
  if (a === 'mute') return toggleMute();
  if (a === 'new') { ui.overlay = { type: 'confirmnew' }; return render(); }
  if (a === 'reallynew' || a === 'again') { G = null; ui = freshUI(); $('#tut').innerHTML = ''; return render(); }
  if (a === 'addseat') { const i = ui.setup.seats.length; ui.setup.seats.push({ name: BOT_NAMES[i], bot: true }); return render(); }
  if (a === 'start') { const s = ui.setup; sfx('good'); startGame(setupSeats(s)); if (s.tut) { ui.tut = { step: 0, who: 0 }; render(); } return; }
  if (a === 'tutnext') { if (ui.tut) { ui.tut.step++; render(); } return; }
  if (a === 'tutskip') return tutFinish(true);
});
document.addEventListener('input', e => { if (e.target.dataset.name !== undefined && ui.setup) ui.setup.names[+e.target.dataset.name] = e.target.value; });
document.addEventListener('change', e => { if (e.target.dataset.tutopt !== undefined && ui.setup) ui.setup.tut = e.target.checked; });
document.addEventListener('keydown', e => {
  const d = e.target.dataset || {};
  if ((e.key === 'Enter' || e.key === ' ') && d.cell !== undefined && e.target.tagName !== 'BUTTON') { e.preventDefault(); onCell(+d.cell); }
  if (e.key === 'Escape' && ui.move !== null && ui.move !== undefined && !ui.overlay) { ui.move = null; render(); }
  if (e.key === 'Escape' && ui.overlay) {
    if (ui.overlay.type === 'card' && !ui.overlay.bot) closeCard();
    else if (['help', 'confirmnew'].includes(ui.overlay.type)) { ui.overlay = null; render(); }
  }
});

// ---------- boot ----------
window.claude?.hot?.snapshot?.(() => ({ G }));
function start(data) {
  if (data && data.G) {
    G = data.G; const wasSkipping = G.skipping; G.skipping = false;
    if (G.over) ui.overlay = { type: 'end' };
    else if (['envy', 'grab'].includes(G.pending) && !cur().bot) ui.overlay = { type: 'steal', mode: G.pending };
    render();
    if (!G.over && cur().bot) runBot();
    else if (!G.over && wasSkipping) endTurn();
  } else render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
