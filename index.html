/* Layout: a kid's desk. A paper city map on the left with a glowing green server closet under it;
   One map per city: downtown lots, a highway, and the Data Center out on the edge of town. ClockIT palette. */
:root{
  color-scheme: light;
  --cream:#fff7eb; --paper:#fffaf2; --sand:#f0d6c2;
  --ink:#3d2b31; --ink-soft:#7a5f66; --line:rgba(61,43,49,.16);
  --rose:#d35269; --rose-soft:#f9cecc; --teal:#487890; --teal-soft:#d3e1e6; --sage:#b3dbcb; --sun:#f2c14e; --gold:#e9a87f;
  --mx-bg:#06150d; --mx-panel:#0b2216; --mx:#39ff88; --mx-dim:#1f8f52; --mx-text:#b8ffd3;
  --good:#3c9a6a; --bad:#d35269; --warn:#f2c14e;
  --house-a:#487890; --house-b:#f2c14e;
  --school-a:#d35269; --school-b:#487890;
  --factory-a:#3d2b31; --factory-b:#e9a87f;
  --hospital-a:#d35269; --hospital-b:#487890;
  --hand:"Chewy","Kineks Round","Comic Sans MS",cursive;
  --round:"Kineks Round","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --term:"VT323","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;font-size:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;position:relative}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
.doodle{position:fixed;pointer-events:none;z-index:0;opacity:.9}
.doodle.s1{top:70px;left:-30px;width:110px}.doodle.s2{bottom:30px;right:-24px;width:90px}.doodle.s3{top:44%;left:6px;width:26px}.doodle.s4{top:120px;right:30px;width:22px}
@media (max-width:700px){.doodle{display:none}}
main,aside,header,.setup{position:relative;z-index:1}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--hand);font-size:clamp(30px,4.6vw,44px);line-height:.9;color:var(--rose);letter-spacing:.01em}
.logo em{font-style:normal;color:var(--teal)}
.logo .bolt{width:.95em;height:.95em}
.hdr-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.round{font-family:var(--round);font-weight:700;font-size:14px;position:relative;padding:6px 14px}
.round svg{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);stroke:var(--sun);stroke-width:3;fill:none}
.btn{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-family:var(--round);font-weight:700;font-size:14px;transition:transform .1s, box-shadow .1s;box-shadow:0 3px 0 var(--ink)}
.btn:hover:not([disabled]){transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.rose{background:var(--rose);color:#fff;border-color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.layout>.side{order:-1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
@media (max-width:640px){.layout>.side{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.paper{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 10px 24px rgba(61,43,49,.08)}
.paper h3{font-family:var(--round);font-weight:700;font-size:15px;margin:0 0 10px;letter-spacing:.02em}

/* ---------- turn + decks ---------- */
.turn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.who{display:flex;align-items:center;gap:10px;font-family:var(--hand);font-size:clamp(22px,3vw,28px);line-height:1;min-width:0}
.badge{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none;font-family:var(--round);font-size:14px;color:#fff}
.draws{display:flex;gap:6px;align-items:center;font-family:var(--round);font-weight:700;font-size:13px;color:var(--ink-soft)}
.draws .bolt{width:20px;height:20px}
.draws .bolt.used{opacity:.22;filter:grayscale(1)}
.turn .btn{margin-left:auto}

.table{display:grid;grid-template-columns:1fr 1fr minmax(130px,auto);gap:14px;margin-bottom:18px}
@media (max-width:600px){.table{grid-template-columns:1fr 1fr}.bank{grid-column:1/-1}}
.deck{position:relative;text-align:left;border:2px solid var(--ink);border-radius:20px;padding:14px 14px 14px 86px;min-height:104px;background:var(--paper);
  box-shadow:5px 5px 0 var(--sand),5px 5px 0 2px var(--ink),10px 10px 0 var(--sand),10px 10px 0 2px var(--ink);transition:transform .12s}
.deck:hover:not([disabled]){transform:translate(-2px,-3px)}
.deck[disabled]{opacity:.55;cursor:not-allowed}
.deck .art{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:42px}
.deck.grid .art{background:var(--teal-soft)}
.deck.energy .art{background:var(--rose-soft)}
.deck b{display:block;font-family:var(--hand);font-weight:400;font-size:22px;line-height:1.05}
.deck.grid b{color:var(--teal)}.deck.energy b{color:var(--rose)}
.deck span.d{display:block;font-size:13px;font-weight:600;color:var(--ink-soft)}
.bank{border:2px solid var(--ink);border-radius:20px;background:#fff6dc;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;position:relative}
.bank .n{font-family:var(--hand);font-size:44px;line-height:1;display:flex;align-items:center;gap:6px}
.bank .n .bolt{width:34px;height:34px}
.bank small{font-family:var(--round);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.bank .flags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.flag{font-family:var(--round);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1.5px solid var(--ink)}
.flag.fw{background:var(--mx-bg);color:var(--mx);border-color:var(--mx-dim)}
.flag.skip{background:var(--rose);color:#fff}

/* ---------- city map ---------- */
.city{border:2px solid var(--ink);border-radius:26px;background:var(--sage);position:relative;overflow:hidden;
  background-image:radial-gradient(circle,rgba(61,43,49,.09) 1.2px,transparent 1.6px);background-size:18px 18px}
.city-top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:16px 18px 4px}
.city-top .t{font-family:var(--hand);font-size:clamp(22px,3.2vw,30px);line-height:1;color:var(--ink)}
.city-top .t small{display:block;font-family:var(--round);font-size:12px;letter-spacing:.12em;color:var(--teal);margin-bottom:4px}
.needs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.need{display:flex;align-items:center;gap:5px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 6px;font-family:var(--round);font-weight:700;font-size:13px}
.need .ico{font-size:22px}
.need.done{background:var(--ink);color:var(--paper)}
.lots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:14px 18px 18px;position:relative}
.lots::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:10px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--paper) 0 18px,transparent 18px 30px);opacity:.7;border-radius:5px}
@media (max-width:520px){.lots{gap:8px;padding:10px}.lots::before{display:none}}
.lot{position:relative;aspect-ratio:1/1.08;max-width:100%;border-radius:20px;border:2px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;transition:transform .14s, box-shadow .14s;box-shadow:0 4px 0 var(--ink)}
.lot.empty{border-style:dashed;border-color:rgba(61,43,49,.45);background:rgba(255,250,242,.55);box-shadow:none}
.lot.empty::after{content:"+";font-family:var(--round);font-size:28px;color:rgba(61,43,49,.25)}
.lot.can:hover{transform:translateY(-3px)}
.lot.legal{background:#effbe9;border:2.5px solid var(--good);box-shadow:0 0 0 4px rgba(60,154,106,.22)}
.lot.legal::after{content:"✓";color:var(--good)}
.lot.trap{background:#fff3cf;border:2.5px solid #c99a1f}
.lot.trap::after{content:"!";color:#a87c10}
.lot.illegal{opacity:.38}
.lot .bi{font-size:clamp(40px,7.4vw,70px)}
.lot .bn{font-family:var(--round);font-weight:700;font-size:clamp(11px,1.6vw,14px);margin-top:2px;white-space:nowrap}
.lot.done{background:#fff}
.lot.done{border-color:var(--ink);box-shadow:0 4px 0 var(--ink),0 0 0 3px rgba(60,154,106,.35)}
.lot .lit{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--sun);border:2px solid var(--ink);border-radius:999px;font-family:var(--round);font-weight:700;font-size:10.5px;padding:1px 8px;letter-spacing:.06em;white-space:nowrap}
.pips{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:5px;max-width:92%}
.pips .bolt{width:clamp(10px,1.7vw,15px);height:clamp(10px,1.7vw,15px)}
.pips .bolt.off{opacity:.18;filter:grayscale(1)}
.shield{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--teal);border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-size:17px}
.mv{position:static;margin-top:5px;border-radius:999px;font-family:var(--round);font-weight:700;font-size:11px;padding:2px 8px;min-height:26px;color:var(--teal);background:var(--teal-soft);border:1.5px solid transparent}
.mv:hover{border-color:var(--teal)}
.mv.on{background:var(--teal);color:#fff}
.map.active .lot:not(.empty),.map.active .pal:not([disabled]),[data-topbank],.map.active [data-bankchip]{touch-action:none;cursor:grab}
.gen-ghost{display:grid;place-items:center;background:#fff6dc;border:2px solid var(--ink);border-radius:50%}.gen-ghost .bolt{width:34px;height:34px}
.rack.drop-ok .server{box-shadow:0 0 0 4px rgba(242,193,78,.6)}.rack.drop-here .server{box-shadow:0 0 0 6px var(--sun)}
.lot.lifted{opacity:.35;border-style:dashed}
.lot.drop-ok{box-shadow:0 0 0 4px rgba(72,120,144,.45)}
.lot.drop-here{transform:scale(1.05);box-shadow:0 0 0 5px var(--teal)}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(.95);box-shadow:0 18px 34px rgba(61,43,49,.35)!important;opacity:.95;margin:0}
.hit{animation:hit .42s}
@keyframes hit{35%{transform:scale(1.07) rotate(-2deg)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.palette{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 14px}
.pal{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);padding:6px 12px 6px 8px;text-align:left;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.pal .ico{font-size:34px}
.pal b{display:block;font-family:var(--round);font-size:14px;line-height:1.1}
.pal small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.pal.sel{background:#fff;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose);transform:translateY(1px);position:relative}
.pal.sel::after{content:"✓";position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--rose);color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid var(--ink)}
.picking .lot.empty{border-color:var(--rose);background:rgba(255,255,255,.85)}
.pal[disabled]{opacity:.38;box-shadow:none;cursor:default}
.pal.ins{background:var(--teal-soft)}.pal.ins.sel{background:var(--teal);color:#fff}.pal.ins.sel small{color:#e4eef2}
.rules{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px}
.rule{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line)}
.rule .ico{font-size:22px}
.rule i{font-style:normal;font-family:var(--round);color:var(--rose)}
.note{margin:0 18px 14px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center}
.note .ico{font-size:24px;flex:none}
.note.warn{background:#fff0c2}
.note.term{background:var(--mx-bg);color:var(--mx-text);border-color:var(--mx-dim);font-family:var(--term);font-size:18px;font-weight:400;line-height:1.1}

/* ---------- data center: the green server closet ---------- */
.dc{position:relative;margin-top:20px;border-radius:26px;background:var(--mx-bg);border:2px solid var(--ink);overflow:hidden;color:var(--mx-text);box-shadow:0 10px 26px rgba(6,21,13,.25)}
.dc canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.dc-in{position:relative;padding:16px 18px 18px}
.dc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dc-head .t{font-family:var(--hand);font-size:28px;line-height:1;color:var(--mx);text-shadow:0 0 12px rgba(57,255,136,.45);display:flex;align-items:center;gap:10px}
.dc-head .t .ico{font-size:34px;stroke:var(--mx)}
.dc-st{margin-left:auto;font-family:var(--term);font-size:19px;line-height:1;border:1.5px solid var(--mx-dim);border-radius:8px;padding:5px 10px 4px;background:rgba(6,21,13,.8)}
.racks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:560px){.racks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rack{position:relative;min-width:0;background:transparent;border:0;padding:0;text-align:center;color:inherit;transition:transform .14s}
.rack:hover:not(.on){transform:translateY(-3px)}
.server{position:relative;margin:0 auto;width:min(100%,128px);aspect-ratio:1/1.25;border-radius:22px 22px 14px 14px;background:linear-gradient(#123824,#0c2919);border:2.5px solid #2c6e4a;display:flex;flex-direction:column;align-items:center;padding:12% 10% 8%;gap:7%}
.rack.on .server{border-color:var(--mx);box-shadow:0 0 0 3px rgba(57,255,136,.16),0 0 26px rgba(57,255,136,.4)}
.face{display:flex;gap:22%;justify-content:center;width:100%;height:18%}
.eye{width:22%;aspect-ratio:1;border-radius:50%;background:#204a33;position:relative}
.rack.on .eye{background:var(--mx);box-shadow:0 0 10px var(--mx);animation:blinkeye 4.5s infinite}
.rack.on .eye::after{content:"";position:absolute;width:35%;height:35%;border-radius:50%;background:#06150d;top:30%;left:32%}
.rack.on.sleeping .eye{height:3px;margin-top:10%;background:#5f8f74;box-shadow:none;animation:none}
.rack.on.sleeping .eye::after{display:none}
@keyframes blinkeye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mouth{width:34%;height:7%;border:2.5px solid #2c6e4a;border-top:0;border-radius:0 0 999px 999px}
.rack.on .mouth{border-color:var(--mx)}
.rack.on.sleeping .mouth{border-radius:999px;height:0;border-width:2px 0 0;border-color:#5f8f74}
.bays{display:flex;flex-direction:column;gap:6%;width:100%;flex:1}
.bay{flex:1;border-radius:7px;background:#08190f;border:1.5px solid #255c3e;display:flex;align-items:center;justify-content:center;gap:6px}
.bay .bolt{width:20px;height:20px}
.bay.empty .bolt{opacity:.15;filter:grayscale(1)}
.rack.on .bay{border-color:var(--mx-dim)}
.zz{position:absolute;top:-6px;right:6px;font-family:var(--hand);color:#9fbdab;font-size:18px}
.rack .lbl{font-family:var(--term);font-size:17px;line-height:1.05;margin-top:8px;color:var(--mx-dim)}
.rack.on .lbl{color:var(--mx)}
.rack .lbl b{display:block;font-weight:400;font-size:14px;opacity:.75;letter-spacing:.06em}
.hit .server{animation:hit .42s}


/* ---------- one map: downtown, highway, data center ---------- */
.map{container-type:inline-size;border:2px solid var(--ink);border-radius:26px;background:var(--sage);position:relative;overflow:hidden;
  background-image:radial-gradient(circle,rgba(61,43,49,.09) 1.2px,transparent 1.6px);background-size:18px 18px}
.map-top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:16px 18px 6px}
.map-top .t{font-family:var(--hand);font-size:clamp(22px,3.2vw,30px);line-height:1}
.map-top .t small{display:block;font-family:var(--round);font-size:12px;letter-spacing:.12em;color:var(--teal);margin-bottom:4px}
.need.dcneed .ico{font-size:20px}
.need.dcneed.done{background:var(--mx-bg);color:var(--mx);border-color:var(--mx-dim)}
.terrain{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(190px,.5fr);align-items:stretch;padding:8px 18px 16px;gap:0}
.town{position:relative;background:color-mix(in srgb,var(--sage) 55%,#fff);border:2px dashed rgba(61,43,49,.25);border-radius:22px;padding:22px 4px 4px}
.zone-tag{position:absolute;top:-11px;left:16px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;font-family:var(--round);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:1px 10px}
.town .lots{padding:6px 10px 12px}
.link{position:relative;min-height:60px}
.link .road{position:absolute;top:-8px;bottom:-16px;left:50%;width:36px;transform:translateX(-50%);background:#a39aa0;border-inline:2px solid var(--ink)}
.link .road::after{content:"";position:absolute;inset:0;left:50%;width:3px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--sun) 0 12px,transparent 12px 24px)}
.link .cable{position:absolute;left:-6px;right:-6px;top:38%;height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 13px);z-index:1}
.link.on .cable{background:repeating-linear-gradient(90deg,var(--sun) 0 8px,var(--ink) 8px 13px);animation:flow .7s linear infinite;box-shadow:0 0 8px rgba(242,193,78,.8)}
@keyframes flow{to{background-position:13px 0}}
.link .pole{position:absolute;top:calc(38% - 10px);width:6px;height:26px;background:var(--ink);border-radius:3px;z-index:2}
.link .pole.a{left:4px}.link .pole.b{right:4px}
.link .sign{position:absolute;top:58%;left:50%;transform:translateX(-50%) rotate(-90deg);white-space:nowrap;font-family:var(--round);font-size:10px;letter-spacing:.08em;background:var(--teal);color:#fff;padding:1px 7px;border-radius:5px;border:1.5px solid var(--ink);z-index:2}
.map .dc{margin:0;border-radius:22px;border:2px dashed var(--mx-dim);outline:2px solid var(--ink);outline-offset:3px;box-shadow:none}
.map .dc.complete{border-style:solid;border-color:var(--mx);box-shadow:0 0 30px rgba(57,255,136,.35)}
.map .dc-in{padding:12px 12px 14px}
.map .dc-head{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:12px}
.map .dc-head .t{font-size:24px}
.dc-st{font-family:var(--term);font-size:17px;line-height:1;border:1.5px solid var(--mx-dim);border-radius:8px;padding:4px 8px 3px;background:rgba(6,21,13,.8)}
.map .dc.complete .dc-st{color:var(--mx)}
.map .racks{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.map .server{width:min(100%,92px)}
.map .rack .lbl{font-size:15px;margin-top:5px}
.map .bay .bolt{width:16px;height:16px}
@container (max-width:640px){.terrain{grid-template-columns:minmax(0,1fr)}.link{min-height:56px}
  .link .road{top:50%;bottom:auto;left:-18px;right:-18px;width:auto;height:34px;transform:translateY(-50%);border-inline:0;border-block:2px solid var(--ink)}
  .link .road::after{left:0;right:0;top:50%;width:auto;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--sun) 0 12px,transparent 12px 24px)}
  .link .cable{left:38%;right:auto;top:-8px;bottom:-8px;width:4px;height:auto;background:repeating-linear-gradient(180deg,var(--ink) 0 8px,transparent 8px 13px)}
  .link.on .cable{background:repeating-linear-gradient(180deg,var(--sun) 0 8px,var(--ink) 8px 13px);animation:flowv .7s linear infinite}
  .link .pole{top:auto;width:26px;height:6px;left:calc(38% - 11px)}.link .pole.a{top:2px}.link .pole.b{bottom:2px;right:auto}
  .link .sign{top:50%;left:62%;transform:translateY(-50%)}
  .map .racks{grid-template-columns:repeat(4,minmax(0,1fr))}
  .map .dc-head{flex-direction:row;align-items:center}
}
@keyframes flowv{to{background-position:0 13px}}
@container (max-width:300px){.map .racks{grid-template-columns:repeat(2,minmax(0,1fr))}.terrain{padding:8px 10px 14px}.town .lots{padding:6px 4px 8px}}


/* ---------- Energy City News TV ---------- */
.tv{position:relative;padding-top:34px}
.ant{position:absolute;top:0;left:50%;width:120px;height:40px;transform:translateX(-50%)}
.ant i{position:absolute;bottom:0;left:50%;width:4px;height:44px;background:var(--ink);border-radius:2px;transform-origin:bottom center}
.ant i:first-child{transform:rotate(-32deg)}.ant i:last-child{transform:rotate(32deg)}
.ant i::after{content:"";position:absolute;top:-7px;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--rose);border:2px solid var(--ink)}
.tv-body{position:relative;display:flex;gap:10px;background:var(--teal);border:2.5px solid var(--ink);border-radius:26px;padding:12px;box-shadow:0 8px 0 var(--ink)}
.screen{position:relative;flex:1;min-width:0;min-height:168px;border-radius:18px;border:2.5px solid var(--ink);background:#1d2b33;color:#fff;overflow:hidden;padding:30px 12px 34px;display:flex;flex-direction:column;justify-content:center}
.screen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.12),transparent 70%);pointer-events:none}
.screen.flash{animation:tvon .5s ease-out}
@keyframes tvon{0%{filter:brightness(3) contrast(.3);transform:scaleY(.04)}40%{transform:scaleY(1)}100%{filter:none}}
.bug{position:absolute;top:8px;left:10px;font-family:var(--hand);font-size:16px;color:var(--sun)}
.live{position:absolute;top:9px;right:10px;font-family:var(--round);font-size:10px;letter-spacing:.08em;color:#ff9aa9}
.band{align-self:flex-start;font-family:var(--round);font-size:11px;letter-spacing:.12em;background:var(--paper);color:var(--ink);padding:2px 8px;border-radius:4px;margin-bottom:6px}
.k-crisis .band{background:var(--rose);color:#fff}.k-clean .band{background:var(--good);color:#fff}.k-dirty .band{background:#8a6f66;color:#fff}.k-ai .band{background:var(--mx);color:var(--mx-bg)}.k-shield .band,.k-power .band{background:var(--sun);color:var(--ink)}
.hl{font-family:var(--hand);font-size:clamp(19px,2.2vw,23px);line-height:1.08;text-wrap:balance}
.sub{font-size:12.5px;font-weight:600;color:#d7e3e8;margin-top:5px;line-height:1.35}
.ticker{position:absolute;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;padding:4px 0;border-top:2px solid var(--ink)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 26s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.panel-r{width:34px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.panel-r i{width:22px;height:22px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.panel-r i+i{background:var(--rose-soft)}
.panel-r .spk{flex:1;width:18px;border-radius:6px;background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 5px);opacity:.5}
.legs{display:flex;justify-content:space-between;padding:0 40px}
.legs i{width:10px;height:18px;background:var(--ink);border-radius:0 0 4px 4px;margin-top:8px}


/* ---------- table: controls + TV on top, one map per mayor below ---------- */
.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;margin-bottom:22px}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
.controls{min-width:0}
.maps{display:flex;flex-direction:column;gap:26px}

.deck.one{grid-column:span 2}

.mode .ico{font-size:46px}.mode .two{display:flex;gap:2px;font-size:40px}

/* ---------- +/− pops: what a card just did ---------- */
#pops{position:fixed;inset:0;pointer-events:none;z-index:65}
.pop{position:fixed;transform:translate(-50%,-50%);font-family:var(--round);font-weight:700;font-size:22px;line-height:1;padding:4px 11px;border-radius:999px;border:2px solid var(--ink);opacity:0;animation:popup 1.9s ease-out forwards;white-space:nowrap;box-shadow:0 6px 14px rgba(61,43,49,.25)}
.pop.good{background:#dff3e6;color:#1f6b45}.pop.bad{background:var(--rose);color:#fff}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}14%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-150%) scale(1)}100%{opacity:0;transform:translate(-50%,-185%)}}
.ring{position:fixed;border:4px solid var(--rose);border-radius:16px;animation:ringout 1.5s ease-out forwards}
@keyframes ringout{0%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.card .changes{list-style:none;margin:10px 14px 0;padding:0;display:flex;flex-direction:column;gap:5px;text-align:left}

.card .backtag{margin:10px 16px 0;font-family:var(--round);font-size:13px;color:#8a5b00;background:#fff0c2;border:2px dashed #c99a1f;border-radius:10px;padding:4px 8px}

/* ---------- tutorial: blurred spotlight + coach box ---------- */
.tut-veil{position:fixed;z-index:44;background:rgba(61,43,49,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tut-ring{position:fixed;z-index:44;border:4px solid var(--rose);border-radius:20px;pointer-events:none;animation:tutpulse 1.4s ease-in-out infinite}
@keyframes tutpulse{50%{box-shadow:0 0 0 8px rgba(211,82,105,.3)}}
.coach{position:fixed;z-index:46;width:min(340px,calc(100vw - 24px));background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:14px 16px 12px;box-shadow:0 16px 34px rgba(61,43,49,.35);animation:pop .28s ease-out}
.coach::before{content:"";position:absolute;top:-10px;left:calc(var(--ax,50%) - 9px);width:16px;height:16px;background:var(--paper);border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg)}
.coach.dock{left:auto;top:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 32px))}
.coach.dock::before{display:none}
.coach.above::before{top:auto;bottom:-10px;transform:rotate(225deg)}
.coach .sc{font-family:var(--round);font-size:11px;letter-spacing:.1em;color:var(--teal);text-transform:uppercase}
.coach h4{font-family:var(--hand);font-weight:400;font-size:26px;color:var(--rose);margin:2px 0 4px;line-height:1.05}
.coach p{margin:0;font-size:14.5px;font-weight:600;line-height:1.45}
.coach .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.coach .skip{background:none;border:0;font-weight:700;font-size:12.5px;color:var(--ink-soft);text-decoration:underline;padding:4px}
.coach .doing{font-family:var(--round);font-size:13px;color:var(--rose)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.tutopt{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700;font-size:14px;cursor:pointer}
.tutopt input{width:20px;height:20px;accent-color:var(--rose)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(61,43,49,.5);display:grid;place-items:center;z-index:50;padding:20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:22px;max-width:580px;width:100%;box-shadow:0 18px 40px rgba(61,43,49,.25);position:relative}
.modal h2{font-family:var(--hand);font-weight:400;margin:0 0 8px;font-size:32px;line-height:1.05;color:var(--rose);text-wrap:balance}
.modal p{margin:.4em 0}
.stack{display:flex;flex-direction:column;align-items:center;gap:18px}
.card{width:min(290px,82vw);border-radius:24px;background:var(--paper);border:2.5px solid var(--ink);overflow:hidden;box-shadow:0 22px 40px rgba(61,43,49,.35);animation:flip .55s cubic-bezier(.2,.9,.3,1.25);text-align:center;position:relative}
@keyframes flip{from{transform:perspective(900px) rotateY(95deg) translateY(30px) scale(.75)}to{transform:none}}
.card .band{padding:12px 14px 10px;color:#fff;font-family:var(--round);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.card .band.clean{background:var(--good)}.card .band.power{background:var(--teal)}.card .band.dirty{background:#8a6f66}.card .band.crisis{background:var(--rose)}.card .band.shield{background:var(--teal)}.card .band.ai{background:var(--mx-bg);color:var(--mx);font-family:var(--term);font-size:18px;letter-spacing:.08em}
.card .ttl{font-family:var(--hand);font-size:28px;line-height:1.02;padding:12px 14px 0;text-wrap:balance}
.card .pic{margin:10px 18px;height:132px;border-radius:18px;display:grid;place-items:center;font-size:96px;position:relative}
.card .pic.clean{background:#dff3e6}.card .pic.power{background:var(--teal-soft)}.card .pic.dirty{background:#eadfd8}.card .pic.crisis{background:var(--rose-soft)}.card .pic.shield{background:var(--teal-soft)}.card .pic.ai{background:var(--mx-bg)}
.card .pic.ai .ico{stroke:var(--mx)}
.card .pic .star{position:absolute;width:22px;top:10px;right:14px}
.card .fx{font-family:var(--round);font-size:18px;margin:0 16px;padding:6px 8px;border-radius:12px;background:#fff6dc;border:2px solid var(--ink)}
.card .nt{font-size:13px;font-weight:600;color:var(--ink-soft);padding:8px 18px 0}
.card .res{margin:12px 14px 14px;font-weight:800;font-size:14px;color:#fff;border-radius:14px;padding:8px 10px}
.card .by{font-family:var(--round);font-size:12px;color:var(--ink-soft);padding-top:10px}
.seats{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.seat{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:6px 8px;flex-wrap:wrap}
.seat input{flex:1;min-width:110px;border:2px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit;font-weight:700}
.seg{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-family:var(--round);font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper)}
.steps{display:flex;flex-direction:column;gap:12px;margin:10px 0 16px;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps li .ico{font-size:40px;margin-top:-2px}
.steps b{font-family:var(--round)}
.report{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0;font-variant-numeric:tabular-nums}
.report th,.report td{padding:6px;border-bottom:1.5px solid var(--sand);text-align:right}
.report th:first-child,.report td:first-child{text-align:left}
.report th{font-family:var(--round);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:700;padding:11px 18px;border-radius:16px;z-index:60;max-width:min(92vw,500px);text-align:center;box-shadow:0 10px 24px rgba(61,43,49,.3)}
.doodle-in{position:absolute;top:-16px;right:22px;width:44px}
.hero{text-align:center;margin:10px 0 22px}
.hero .logo{justify-content:center;font-size:clamp(46px,10vw,84px)}
.hero p{font-family:var(--round);font-size:clamp(15px,2.2vw,19px);margin:8px 0 0}
.hero p span{color:var(--mx-dim)}
.setup .layout{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
@media (max-width:940px){.setup .layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
  .deck{padding:12px 12px 12px 12px;min-height:0}
  .deck .art{position:static;transform:none;width:44px;height:44px;font-size:30px;border-radius:12px;margin-bottom:6px}
  .deck b{font-size:19px}
  .bank{flex-direction:row;gap:12px;padding:8px 14px}.bank .n{font-size:34px}
  .lot{border-radius:14px;padding:6px 3px}
  .lot .bn{font-size:10px}
  .lot .bn .nm{display:none}
  .lot .mv{padding:0 6px;min-height:22px;font-size:9.5px;margin-top:3px}
  .shield{width:24px;height:24px;font-size:13px;top:-8px;right:-8px}
  .lot .lit{font-size:8.5px;padding:0 5px}
  .hdr-right .btn{padding:6px 12px;font-size:13px}
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 12px}
  .pal{padding:5px 8px 5px 6px}.pal .ico{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// ---------- rules ----------

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

let G = null;        // game state (serializable)
let ui = { sel: null, overlay: null, move: null, hit: null, think: '', setup: null };
let botGame = null;  // the game a bot loop is currently running for

function newEnergyDeck() { const d = []; for (const k in DECK_MIX) for (let i = 0; i < DECK_MIX[k]; i++) d.push(k); return shuffle(d); }
function cur() { return G.players[G.cur]; }
function online(p) { return p.racks.filter(r => r >= RACK_COST).length; }
function done(b) { return b && b.gens >= COST[b.type]; }
function count(p, t) { return p.grid.filter(b => b && b.type === t).length; }
function builtCount(p) { return p.grid.filter(done).length; }
function rackSpace(p) { return p.racks.reduce((s, r) => s + (RACK_COST - r), 0); }
function progress(p) { const tot = 32 + RACKS * RACK_COST; const have = p.grid.reduce((s, b) => s + (b ? Math.min(b.gens, COST[b.type]) : 0), 0) + p.racks.reduce((s, r) => s + r, 0); return have / tot; }
function refill() { if (!G.energy.length) { G.energy = newEnergyDeck(); log('The Energy deck was shuffled again.', '#999'); } }
function peek() { refill(); return G.energy[G.energy.length - 1]; }
function takeEnergy() { refill(); return G.energy.pop(); }
function log(t, c, k, h) { G.seq = (G.seq || 0) + 1; G.log.unshift({ t, c: c || cur().color, k, h, id: G.seq }); G.log.length = Math.min(G.log.length, 40); }

function canPlace(p, i, t) {
  if (p.grid[i]) return { ok: false, why: 'That spot already has a building.' };
  if (count(p, t) >= NEED[t]) return { ok: false, why: `Your city already has all its ${BPLURAL[t]}.` };
  const ns = nbrs(i).map(j => p.grid[j] && p.grid[j].type);
  // City rules: schools and hospitals need clean air, and a hospital needs a house next door.
  if (t === 'school' && ns.includes('factory')) return { ok: false, why: 'Schools need clean air! A School can’t go next to a Factory.' };
  if (t === 'hospital' && ns.includes('factory')) return { ok: false, why: 'Hospitals need clean air! A Hospital can’t go next to a Factory.' };
  if (t === 'hospital' && !ns.includes('house')) return { ok: false, why: 'A Hospital needs a House next door.' };
  if (t === 'factory' && ns.includes('school')) return { ok: false, why: 'Schools need clean air! A Factory can’t go next to the School.' };
  if (t === 'factory' && ns.includes('hospital')) return { ok: false, why: 'Hospitals need clean air! A Factory can’t go next to the Hospital.' };
  return { ok: true };
}

// Finds a full layout that obeys every rule, starting from the buildings already placed. null = dead end.
function solve(types, random) {
  const rem = []; for (const t of TYPES) { const have = types.filter(x => x === t).length; for (let k = have; k < NEED[t]; k++) rem.push(t); }
  const empty = types.map((x, i) => x ? -1 : i).filter(i => i >= 0);
  if (random) shuffle(empty);
  const a = types.slice();
  const clean = t => t === 'school' || t === 'hospital';
  const clash = (i, t) => nbrs(i).some(j => (t === 'factory' && clean(a[j])) || (clean(t) && a[j] === 'factory'));
  const rec = k => {
    if (k === empty.length) return layoutProblem(a) ? null : a.slice();
    const cell = empty[k]; let opts = [...new Set(rem)]; if (random) shuffle(opts);
    for (const t of opts) {
      if (clash(cell, t)) continue;
      a[cell] = t; rem.splice(rem.indexOf(t), 1);
      const r = rec(k + 1); if (r) return r;
      rem.push(t); a[cell] = null;
    }
    return null;
  };
  return rec(0);
}
const typesOf = p => p.grid.map(b => b ? b.type : null);

// ---------- setup ----------
function defaultSetup() { return { tut: !tutDone(), mode: 'cpu', names: ['', ''] }; }
function setupSeats(s) {
  const n = i => (s.names[i] || '').trim() || `Mayor ${i + 1}`;
  return s.mode === 'cpu' ? [{ name: n(0), bot: false }, { name: 'Volt Bot', bot: true }] : [{ name: n(0), bot: false }, { name: n(1), bot: false }];
}
function startGame(seats) {
  G = {
    players: seats.map((s, i) => ({ name: s.name.trim() || (s.bot ? BOT_NAMES[i] : `Mayor ${i + 1}`), bot: s.bot, color: PCOLORS[i],
      grid: Array(8).fill(null), racks: [0, 0, 0, 0], bank: START_BANK, ins: 0, firewall: false, skip: false, plan: null,
      stats: { clean: 0, dirty: 0, other: 0, lost: 0, turns: 0 } })),
    cur: 0, round: 1, actions: DRAWS, energy: newEnergyDeck(), log: [], over: false, winner: null, turn: 0, skipping: false, pending: null,
  };
  ui = { sel: null, overlay: null, move: null, hit: null, think: '', setup: null };
  log('Welcome to Energy City! First to power the whole city and its Data Center wins.', '#3d2b31');
  startTurn(true);
}

// ---------- turn flow ----------
function startTurn(first) {
  const p = cur();
  G.turn++; G.actions = DRAWS; G.skipping = false; G.pending = null; ui.sel = null; ui.think = ''; ui.move = null;
  p.stats.turns++;
  if (INCOME) { p.bank += INCOME; p.stats.other += INCOME; (ui.fx = ui.fx || []).push({ pi: G.cur, key: 'bank', d: INCOME }); }
  if (p.skip) {
    p.skip = false; G.actions = 0; G.skipping = true;
    log(`${p.name} is cooling down after an Overload and skips this turn.`);
    render(); toast(`${p.name} skips this turn (Overload)`);
    const g = G, t = G.turn;
    setTimeout(() => { if (G === g && G.turn === t) endTurn(); }, 1600);
    return;
  }
  const humans = G.players.filter(x => !x.bot).length;
  if (!p.bot && humans > 1 && !first) ui.overlay = { type: 'pass' };
  render();
  const m = $('.map.active'); if (m && !first) m.scrollIntoView({ block: 'nearest' });
  if (p.bot) runBot();
}

function endTurn() {
  if (!G || G.over) return;
  G.cur = (G.cur + 1) % G.players.length;
  if (G.cur === 0) { if (G.lastRound) return finishGame(); G.round++; }
  startTurn();
}

// Everyone gets the same number of turns. If two cities finish, the one built with more clean power wins.
function finishGame() {
  const fin = G.players.filter(x => x.finished);
  fin.sort((a, b) => (b.stats.clean - a.stats.clean) || (a.stats.lost - b.stats.lost));
  G.over = true; G.winner = G.players.indexOf(fin[0]);
  log(fin.length > 1 ? `${fin.length} cities finished! ${fin[0].name} wins with the most clean power.` : `${fin[0].name} wins Energy City!`, fin[0].color);
  sfx('win'); ui.overlay = { type: 'end' }; ui.think = ''; render();
}

function checkWin(p) {
  if (G.over) return true;
  if (!p.finished && p.grid.every(done) && online(p) === RACKS) {
    p.finished = true;
    log(`${p.name} powered the whole city AND the Data Center!`);
    sfx('win');
    if (!G.lastRound) {
      G.lastRound = true;
      if (G.cur < G.players.length - 1) {
        log('Last turns! Everyone after them gets one more turn to finish.', '#d35269');
        toast(`${p.name} finished! Everyone else gets one last turn.`);
      }
    }
    if (!p.bot) { G.actions = 0; toast('You finished! End your turn to see who wins.'); }
    render();
    return true;
  }
  return !!p.finished;
}

function addGen(p, target) {
  if (p.bank < 1) return false;
  if (target.kind === 'cell') {
    const b = p.grid[target.i]; if (!b || done(b)) return false;
    p.bank--; b.gens++; ui.hit = G.cur + 'c' + target.i;
    if (done(b)) { sfx('build'); log(`${p.name} powered up a ${BNAME[b.type]}!`); } else sfx('plop');
  } else {
    const i = p.racks.findIndex(r => r < RACK_COST); if (i < 0) return false;
    p.bank--; p.racks[i]++; ui.hit = G.cur + 'r' + i;
    if (p.racks[i] >= RACK_COST) { sfx('build'); const n = online(p); log(n === RACKS ? `${p.name}’s Data Center is fully online and running AI!` : `${p.name} powered server rack ${n} of ${RACKS} at the Data Center.`, '#1f8f52'); } else sfx('plop');
  }
  checkWin(p);
  return true;
}

// Takes n generators: Power Bank first, then unfinished, uninsured builds (fullest first). Returns how many were lost.
function loseGens(p, n) {
  const fromBank = Math.min(n, p.bank); p.bank -= fromBank;
  let lost = fromBank;
  while (lost < n) {
    const c = p.grid.filter(b => b && !b.insured && !done(b) && b.gens > 0).sort((a, b) => b.gens - a.gens)[0];
    if (!c) break; c.gens--; lost++;
  }
  p.stats.lost += lost;
  return lost;
}

// Diesel and Nuclear hurt one building. If it isn't built yet, the smoke hits the rest of your city instead.
function smokeHit(p, type, n) {
  const b = p.grid.find(x => x && x.type === type);
  if (b && b.insured) return ` Your ${BNAME[type]} is insured, so it’s safe.`;
  if (b && b.gens > 0) { const l = Math.min(n, b.gens); b.gens -= l; p.stats.lost += l; return ` Your ${BNAME[type]} lost ${l}.`; }
  const l = loseGens(p, n);
  return l ? ` Your ${BNAME[type]} had no power yet, so the smoke cost you ${l} from the rest of your city.` : '';
}

function resolveCard(p, id) {
  const c = CARDS[id]; let res = '', tone = 'good', pending = null, back = null;
  switch (id) {
    case 'grid': case 'gen': p.bank += 1; p.stats.other += 1; res = '+1 generator to place.'; break;
    case 'theft': p.theft = (p.theft || 0) + 1; res = 'The next time someone tries to steal from you, it’s blocked.'; tone = 'shield'; break;
    case 'grab': {
      const rivals = G.players.filter(x => x !== p && x.bank > 0);
      if (!rivals.length) back = 'No rival has any generators to grab yet.';
      else { pending = 'grab'; res = 'Choose a rival to grab power from.'; }
      tone = 'mixed'; break;
    }
    case 'wind': p.bank += 2; p.stats.clean += 2; res = '+2 clean generators!'; break;
    case 'solar': p.bank += 3; p.stats.clean += 3; res = '+3 clean generators!'; break;
    case 'diesel': { p.bank += 4; p.stats.dirty += 4; const h = smokeHit(p, 'hospital', 1); res = '+4 generators.' + h; if (/lost|cost/.test(h)) tone = 'mixed'; break; }
    case 'nuclear': { p.bank += 6; p.stats.dirty += 6; const h = smokeHit(p, 'school', 3); res = '+6 generators.' + h; if (/lost|cost/.test(h)) tone = 'mixed'; break; }
    case 'protest': {
      if (!p.bank && !p.grid.some(b => b && !b.insured && !done(b) && b.gens > 0)) { back = 'You have no generators for the protest to take.'; break; }
      const l = loseGens(p, 2);
      res = l ? `You lost ${plural(l, 'generator')}.` : 'You had nothing to lose. Phew!'; tone = l ? 'bad' : 'good'; break;
    }
    case 'insurance':
      if (!p.grid.some(b => b && !b.insured)) { back = 'You don’t have a building to insure yet.'; break; }
      p.ins++; res = 'Drag the shield onto a building to protect it, or tap a building.'; pending = 'insure'; tone = 'shield'; break;
    case 'overload': p.bank += 3; p.stats.other += 3; p.skip = true; res = '+3 generators, but you’ll skip your next turn.'; tone = 'mixed'; break;
    case 'firewall': p.firewall = true; res = 'Your servers are protected from the next Server Outage.'; tone = 'shield'; break;
    case 'outage': {
      if (p.firewall) { p.firewall = false; res = 'Your Firewall blocked it!'; tone = 'shield'; break; }
      const idx = [3, 2, 1, 0].find(i => p.racks[i] > 0);
      if (idx === undefined) { back = 'You have no servers powered yet, so there’s nothing to break.'; break; }
      p.racks[idx]--; p.stats.lost++; res = `Server rack ${idx + 1} lost a generator.`; tone = 'bad'; break;
    }
    case 'heat': {
      const n = online(p);
      if (!n) { back = 'You have no servers running yet, so nothing needs cooling.'; break; }
      const l = loseGens(p, n); res = `Cooling your ${plural(n, 'rack')} cost ${l} ⚡.`; tone = 'bad'; break;
    }
    case 'smart': { const n = online(p); if (!n) { back = 'You have no servers running yet, so there’s no AI to help.'; break; } p.bank += n; p.stats.other += n; res = `Your Data Center’s AI found +${n} ⚡!`; break; }
    case 'envy': {
      const rivals = G.players.filter(x => x !== p && x.bank > 0);
      if (!rackSpace(p)) back = 'Your Data Center is already full.';
      else if (!rivals.length) back = 'No rival has any generators to take yet.';
      else { pending = 'envy'; res = 'Choose a rival to take power from.'; }
      tone = 'mixed'; break;
    }
  }
  // A card that can't do anything right now is shuffled back into the deck for later.
  if (back) { G.energy.splice(Math.floor(Math.random() * (G.energy.length + 1)), 0, id); return { res: back + ' This card goes back into the deck.', tone: 'mixed', pending: null, card: c, id, back: true }; }
  return { res, tone, pending, card: c, id };
}

// Envy Country (into your Data Center) and Power Grab (into your bank). Theft Insurance blocks either.
function doSteal(p, victim, mode) {
  G.pending = null;
  const before = snap();
  const card = mode === 'envy' ? 'Envy Country' : 'Power Grab';
  if (victim.theft) { victim.theft--; log(`${victim.name}’s Theft Insurance blocked ${p.name}’s ${card}!`, victim.color, 'shield', `${victim.name} blocks a steal`); toast(`${victim.name}’s Theft Insurance blocked it!`); sfx('bad'); return; }
  const n = mode === 'envy' ? Math.min(4, victim.bank, rackSpace(p)) : Math.min(3, victim.bank);
  victim.bank -= n; victim.stats.lost += n;
  if (mode === 'envy') for (let k = 0; k < n; k++) { const i = p.racks.findIndex(r => r < RACK_COST); p.racks[i]++; }
  else p.bank += n;
  log(`${p.name} took ${n} ⚡ from ${victim.name}${mode === 'envy' ? ' for their Data Center' : ''}.`, p.color, 'steal', `${p.name} grabs power from ${victim.name}`);
  sfx('good');
  const ch = changes(before); (ui.fx = ui.fx || []).push(...ch);
  toast(ch.map(c => c.text).join(' · '));
  checkWin(p);
}
function stealTargets(p, mode) { return G.players.filter(x => x !== p && x.bank > 0); }

// Before/after pictures of every city, so players can see exactly what a card did.
function snap() { return G.players.map(p => ({ bank: p.bank, gens: p.grid.map(b => b ? b.gens : null), lit: p.grid.map(b => !!done(b)), type: p.grid.map(b => b && b.type), racks: p.racks.slice() })); }
function changes(before) {
  const out = [], n = x => `${Math.abs(x)} generator${Math.abs(x) === 1 ? '' : 's'}`;
  G.players.forEach((p, pi) => {
    const a = before[pi], who = pi === G.cur ? 'Your' : `${p.name}’s`;
    if (p.bank !== a.bank) out.push({ pi, key: 'bank', d: p.bank - a.bank, text: p.bank > a.bank ? `${pi === G.cur ? 'You' : p.name} got ${n(p.bank - a.bank)} to place` : `${pi === G.cur ? 'You' : p.name} lost ${n(a.bank - p.bank)} you hadn’t placed`.replace(' you hadn’t', pi === G.cur ? ' you hadn’t' : ' they hadn’t') });
    p.grid.forEach((b, i) => {
      if (!b || a.type[i] !== b.type || a.gens[i] === b.gens) return;
      const d = b.gens - a.gens[i];
      out.push({ pi, key: 'c' + i, d, text: `${who} ${BNAME[b.type]} ${d < 0 ? 'lost' : 'got'} ${n(d)}${a.lit[i] && !done(b) ? ' and went dark!' : ''}` });
    });
    p.racks.forEach((r, i) => { const d = r - a.racks[i]; if (d) out.push({ pi, key: 'r' + i, d, text: `${who} server rack ${i + 1} ${d < 0 ? 'lost' : 'got'} ${n(d)}` }); });
  });
  return out;
}
// Floating +2 / −1 tags over whatever changed. They live outside the page so re-renders don't wipe them.
function showPops(list) {
  const layer = $('#pops'); if (!layer || !list.length) return;
  list.forEach((c, k) => {
    const targets = c.key === 'bank' ? [document.querySelector(`[data-bankchip="${c.pi}"]`), c.pi === G.cur ? $('[data-topbank]') : null] : [document.querySelector(`[data-hit="${c.pi}${c.key}"]`)];
    targets.filter(Boolean).forEach(el => {
      const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
      const pop = document.createElement('div');
      pop.className = 'pop ' + (c.d > 0 ? 'good' : 'bad'); pop.textContent = (c.d > 0 ? '+' : '−') + Math.abs(c.d);
      Object.assign(pop.style, { left: (r.left + r.width / 2) + 'px', top: (r.top + 10) + 'px', animationDelay: (k * 0.12) + 's' });
      layer.appendChild(pop); setTimeout(() => pop.remove(), 2200);
      if (c.d < 0 && c.key !== 'bank') {
        const ring = document.createElement('div'); ring.className = 'ring';
        Object.assign(ring.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
        layer.appendChild(ring); setTimeout(() => ring.remove(), 1600);
      }
    });
  });
}

function draw() {
  const p = cur();
  if (G.actions <= 0 || G.over) return null;
  G.actions--;
  const id = takeEnergy();
  const before = snap();
  const r = resolveCard(p, id);
  const ch = changes(before);
  (ui.fx = ui.fx || []).push(...ch);
  const third = r.res.replace(/\byou’ll\b/gi, 'they’ll').replace(/\bYour\b/g, 'Their').replace(/\byour\b/g, 'their').replace(/\bYou\b/g, 'They').replace(/\byou\b/g, 'them');
  log(`${p.name}: ${third}`, null, r.card.kind, `${r.card.name} ${{ crisis: 'hits', dirty: 'fires up', clean: 'powers up', power: 'powers up', steal: 'sneaks into' }[r.card.kind] || 'arrives in'} ${p.name}’s city`);
  sfx(r.tone === 'bad' ? 'bad' : r.tone === 'mixed' ? 'mixed' : 'good');
  if (!p.bot && (r.pending === 'envy' || r.pending === 'grab')) G.pending = r.pending;
  // a bot never covers a window the player opened (help, new game)
  if (!ui.overlay || ui.overlay.type === 'card') ui.overlay = { type: 'card', id, res: r.res, tone: r.tone, pending: r.pending, who: p.name, bot: p.bot, ch, back: r.back };
  render();
  return r;
}

// ---------- human input ----------
function humanTurn() { return G && !G.over && !G.skipping && !cur().bot && !ui.overlay; }

function placedAny(p) { return p.grid.some(Boolean); }
function allPlaced(p) { return p.grid.every(Boolean); }
function hasHouse(p) { return p.grid.some(b => b && b.type === 'house'); }
function leftToPlace(p) { return p.grid.filter(b => !b).length; }
function onDraw() {
  if (!humanTurn() || G.actions <= 0) return;
  if (!hasHouse(cur())) { sfx('nope'); return toast('Place your first House to start! Pick House below, then tap an empty lot.'); }
  draw();
}

function closeCard() {
  const o = ui.overlay; if (!o || o.type !== 'card' || o.bot) return;
  ui.overlay = null;
  const p = cur();
  if (o.pending === 'insure' && p.grid.some(b => b && !b.insured)) { ui.sel = 'insure'; toast('Drag the shield onto a building, or tap a building. You can also save it for later.'); }
  if (o.pending === 'envy' || o.pending === 'grab') ui.overlay = { type: 'steal', mode: o.pending };
  render();
}

function onCell(i) {
  if (!humanTurn()) return;
  const p = cur(), b = p.grid[i];
  if (ui.move !== null && ui.move !== undefined) return tryMove(ui.move, i);
  if (ui.sel === 'insure') {
    if (!b) return toast('Insurance goes on a building. Tap one of your buildings.');
    if (b.insured) return toast('That building is already insured.');
    b.insured = true; p.ins--; ui.sel = null; log(`${p.name} insured their ${BNAME[b.type]}.`); sfx('good'); ui.hit = G.cur + 'c' + i; return render();
  }
  if (!b) {
    if (!ui.sel) { shakeCell(i); return toast('First pick a building from the list under your city.'); }
    const r = canPlace(p, i, ui.sel);
    if (!r.ok) { shakeCell(i); sfx('nope'); return toast(r.why); }
    p.grid[i] = { type: ui.sel, gens: 0, insured: false }; ui.hit = G.cur + 'c' + i; sfx('plop');
    log(`${p.name} planned a ${BNAME[ui.sel]}.`);
    if (count(p, ui.sel) >= NEED[ui.sel]) ui.sel = null;
    if (!solve(typesOf(p))) toast('Uh oh. The rest of your buildings can’t fit now. Drag a building to a new spot.');
    else if (p.bank > 0) toast(`Now tap the ${BNAME[p.grid[i].type]} to add generators.`);
    return render();
  }
  if (done(b)) return toast(`This ${BNAME[b.type]} is fully powered!`);
  if (p.bank < 1) { shakeBank(); return toast('You have no generators to place. Draw a card on your turn to get more.'); }
  addGen(p, { kind: 'cell', i }); render();
}
function onRack() {
  if (!humanTurn()) return;
  const p = cur();
  if (ui.sel === 'insure') return toast('Insurance protects city buildings. A Firewall card protects servers.');
  if (online(p) >= RACKS) return toast('Every server rack is already running.');
  if (p.bank < 1) { shakeBank(); return toast('You have no generators to place. Draw a card on your turn to get more.'); }
  addGen(p, { kind: 'rack' }); render();
}
// Checks the city rules for every building already placed.
function layoutProblem(types) {
  for (let i = 0; i < 8; i++) {
    const ns = nbrs(i).map(j => types[j]);
    if (types[i] === 'school' && ns.includes('factory')) return 'Schools need clean air! A School can’t be next to a Factory.';
    if (types[i] === 'hospital' && ns.includes('factory')) return 'Hospitals need clean air! A Hospital can’t be next to a Factory.';
    if (types[i] === 'hospital' && !ns.includes('house')) return 'A Hospital needs a House next door.';
  }
  return null;
}
// Moves a building to another lot, or swaps two buildings. Generators and insurance go with it.
function tryMove(from, to) {
  const p = cur();
  ui.move = null;
  if (from === to || !p.grid[from]) return render();
  const t = typesOf(p); [t[from], t[to]] = [t[to], t[from]];
  const why = layoutProblem(t);
  if (why) { sfx('nope'); shakeCell(to); render(); return toast(`Can’t move it there. ${why}`); }
  const a = p.grid[from], b = p.grid[to];
  p.grid[to] = a; p.grid[from] = b;
  log(b ? `${p.name} swapped their ${BNAME[a.type]} and ${BNAME[b.type]}.` : `${p.name} moved their ${BNAME[a.type]}.`);
  sfx('plop'); ui.hit = G.cur + 'c' + to; render();
}
function moveTargets(p, from) {
  return p.grid.map((_, j) => { if (j === from) return false; const t = typesOf(p); [t[from], t[j]] = [t[j], t[from]]; return !layoutProblem(t); });
}
function onMoveBtn(i, ev) {
  ev.stopPropagation(); if (!humanTurn()) return;
  ui.move = ui.move === i ? null : i; ui.sel = null;
  if (ui.move !== null) toast('Now tap the lot where it should go. Tap a building to swap them.');
  render();
}

// Drag and drop for everything on your map. Taps still work the same way.
//   building from the list -> empty lot       (place it)
//   ⚡ from "to place"     -> building or rack (power it)
//   insurance shield      -> building         (protect it)
//   building on the map   -> another lot      (move or swap)
let drag = null, eatClick = false;
function dragSource(e) {
  if (!humanTurn() || e.button > 0 || e.target.closest('[data-move]')) return null;
  const p = cur(), mine = el => el && el.closest('.map.active');
  const pick = e.target.closest('.map.active .pal[data-pick]:not([disabled])');
  if (pick) return pick.dataset.pick === 'insure' ? (p.ins > 0 ? { kind: 'insure', el: pick } : null) : { kind: 'place', type: pick.dataset.pick, el: pick };
  const bank = e.target.closest(`[data-topbank], [data-bankchip="${G.cur}"]`);
  if (bank && p.bank > 0) return { kind: 'gen', el: bank };
  const lot = e.target.closest('.map.active .lot[data-cell]:not(.empty)');
  if (lot && mine(lot) && ui.sel !== 'insure') return { kind: 'move', from: +lot.dataset.cell, el: lot };
  return null;
}
// Which lots and racks can take what's being dragged.
function dropTargets(d) {
  const p = cur(), cells = [], racks = [];
  p.grid.forEach((b, i) => {
    if (d.kind === 'place') cells[i] = !b && canPlace(p, i, d.type).ok;
    if (d.kind === 'gen') cells[i] = !!b && !done(b);
    if (d.kind === 'insure') cells[i] = !!b && !b.insured;
  });
  if (d.kind === 'move') moveTargets(p, d.from).forEach((ok, i) => { cells[i] = ok; });
  if (d.kind === 'gen' && online(p) < RACKS) p.racks.forEach((r, i) => { racks[i] = r < RACK_COST; });
  return { cells, racks };
}
function dragGhost(d) {
  const r = d.el.getBoundingClientRect();
  let g;
  if (d.kind === 'gen') { g = document.createElement('div'); g.innerHTML = bolt(); Object.assign(g.style, { width: '54px', height: '54px' }); g.classList.add('gen-ghost'); }
  else { g = d.el.cloneNode(true); ['data-cell', 'data-hit', 'data-pick', 'data-bankchip'].forEach(k => g.removeAttribute(k)); Object.assign(g.style, { width: r.width + 'px', height: r.height + 'px' }); }
  g.classList.add('drag-ghost');
  document.body.appendChild(g);
  return g;
}
document.addEventListener('pointerdown', e => {
  const src = dragSource(e); if (!src) return;
  document.querySelectorAll('.drag-ghost').forEach(g => g.remove());
  drag = { ...src, x: e.clientX, y: e.clientY, ghost: null, over: null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
    drag.ghost = dragGhost(drag); drag.el.classList.add('lifted');
    drag.ok = dropTargets(drag);
    document.querySelectorAll('.map.active .lot[data-cell]').forEach(l => { if (drag.ok.cells[+l.dataset.cell]) l.classList.add('drop-ok'); });
    document.querySelectorAll('.map.active .rack[data-rack]').forEach(r => { if (drag.ok.racks[+r.dataset.rack]) r.classList.add('drop-ok'); });
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const spot = under && under.closest('.map.active .lot[data-cell], .map.active .rack[data-rack]');
  if (drag.over && drag.over !== spot) drag.over.classList.remove('drop-here');
  drag.over = spot; if (spot) spot.classList.add('drop-here');
}, { passive: false });
function dropOn(d, spot) {
  const p = cur(), cell = spot.dataset.cell !== undefined ? +spot.dataset.cell : null, rack = spot.dataset.rack !== undefined;
  if (d.kind === 'move') { if (cell !== null) return tryMove(d.from, cell); return render(); }
  if (d.kind === 'place') {
    if (cell === null) return render();
    ui.sel = d.type; return onCell(cell);
  }
  if (d.kind === 'insure') {
    if (cell === null) { render(); return toast('Insurance protects city buildings. Drop it on a building.'); }
    ui.sel = 'insure'; return onCell(cell);
  }
  if (d.kind === 'gen') {
    if (rack) return onRack();
    const b = cell !== null && p.grid[cell];
    if (!b) { render(); return toast('Drop the generator on a building or a server rack.'); }
    ui.sel = null; return onCell(cell);
  }
}
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.ghost) return;
  d.ghost.remove(); eatClick = true; setTimeout(() => { eatClick = false; }, 0);
  if (d.over && e.type === 'pointerup') dropOn(d, d.over); else render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

function onPick(t) { if (!humanTurn()) return; ui.sel = ui.sel === t ? null : t; render(); }
function onEnd() { if (!humanTurn()) return; ui.sel = null; if (ui.tut) ui.tut.ended = true; endTurn(); }

function shakeCell(i) { requestAnimationFrame(() => { const el = document.querySelector(`[data-cell="${i}"]`); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }); }
function shakeBank() { const el = $('.bank'); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
let toastT;
function toast(msg) { const t = $('#toast'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = '', 2800); }

// ---------- computer player ----------
const BOT_ORDER = ['house', 'house', 'rack', 'house', 'house', 'factory', 'rack', 'school', 'factory', 'hospital', 'rack', 'rack'];

function botTarget(p) {
  if (!p.plan || !solve(typesOf(p))) p.plan = solve(typesOf(p), true);
  const seen = { house: 0, school: 0, factory: 0, hospital: 0 }; let rk = 0;
  for (const step of BOT_ORDER) {
    if (step === 'rack') { if (p.racks[rk++] < RACK_COST) return { kind: 'rack' }; continue; }
    const mine = p.grid.map((b, i) => b && b.type === step ? i : -1).filter(i => i >= 0);
    const k = seen[step]++;
    if (k < mine.length) { if (!done(p.grid[mine[k]])) return { kind: 'cell', i: mine[k] }; continue; }
    const spots = p.plan ? p.plan.map((t, i) => t === step && !p.grid[i] ? i : -1).filter(i => i >= 0) : [];
    const spot = spots.find(i => canPlace(p, i, step).ok);
    if (spot !== undefined) { p.grid[spot] = { type: step, gens: 0, insured: false }; log(`${p.name} planned a ${BNAME[step]}.`); return { kind: 'cell', i: spot }; }
  }
  return null;
}

// Lays out the whole city from the bot's plan, one building at a time so players can watch:
// houses first so the hospital has a neighbor.
async function botPlanCity(p, alive) {
  if (!p.plan || !solve(typesOf(p))) p.plan = solve(typesOf(p), true);
  if (!p.plan) return;
  for (const t of ['house', 'factory', 'school', 'hospital'])
    for (let i = 0; i < 8; i++) {
      if (p.plan[i] !== t || p.grid[i] || !canPlace(p, i, t).ok) continue;
      if (!alive()) return;
      p.grid[i] = { type: t, gens: 0, insured: false }; ui.hit = G.cur + 'c' + i;
      ui.think = `${p.name} places a ${BNAME[t]}.`; sfx('plop'); render();
      await sleep(BOT_PACE.place);
    }
  log(`${p.name} finished planning their city.`);
}

function botInsure(p) {
  const score = b => (b.type === 'hospital' || b.type === 'school' ? 10 : 0) + b.gens;
  while (p.ins > 0) {
    const c = p.grid.filter(b => b && !b.insured && b.gens > 0).sort((a, b) => score(b) - score(a))[0];
    if (!c) break; c.insured = true; p.ins--; log(`${p.name} insured their ${BNAME[c.type]}.`);
  }
}

async function botSpend(p, g) {
  botInsure(p);
  while (G === g && !G.over && p.bank > 0) {
    const t = botTarget(p); if (!t) break;
    ui.think = t.kind === 'rack' ? `${p.name} powers a server rack at the Data Center.` : `${p.name} puts a generator in its ${BNAME[p.grid[t.i].type]}.`;
    addGen(p, t); render(); await sleep(BOT_PACE.power);
  }
  botInsure(p);
}

// How long the computer pauses on each move (ms), slow enough for a kid to follow on the map and the TV.
const BOT_PACE = { start: 1300, place: 700, think: 1500, card: 3200, step: 700, power: 650, end: 1100 };
async function runBot() {
  const g = G, p = cur(), t = G.turn;
  if (botGame === g) return;
  botGame = g;
  const alive = () => G === g && !G.over && G.turn === t;
  try {
    ui.think = `${p.name}’s turn. Watch the map below.`; render();
    await sleep(BOT_PACE.start);
    if (!allPlaced(p)) { await botPlanCity(p, alive); await sleep(BOT_PACE.step); }
    while (alive() && G.actions > 0) {
      ui.think = `${p.name} draws a card…`; render(); await sleep(BOT_PACE.think);
      if (!alive()) return;
      const r = draw();
      await sleep(BOT_PACE.card);
      if (!alive()) return;
      if (ui.overlay && ui.overlay.type === 'card') ui.overlay = null;
      if (r && (r.pending === 'envy' || r.pending === 'grab')) {
        const vs = stealTargets(p).sort((a, b) => ((a.theft ? 1 : 0) - (b.theft ? 1 : 0)) || (b.bank - a.bank));
        if (vs[0]) doSteal(p, vs[0], r.pending);
      }
      ui.think = ''; render();
      if (!alive()) return;
      await sleep(BOT_PACE.step);
      await botSpend(p, g);
      await sleep(BOT_PACE.step);
    }
    if (alive()) { ui.think = `${p.name} ends its turn.`; render(); await sleep(BOT_PACE.end); }
  } finally { if (botGame === g) botGame = null; }
  if (alive()) endTurn();
}

// ---------- sound ----------
let ac = null, muted = false;
try { muted = localStorage.getItem('ec-muted') === '1'; } catch (e) {}
function sfx(kind) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { plop: [[520, .06], [780, .07]], build: [[523, .09], [659, .09], [784, .16]], good: [[660, .08], [880, .12]], mixed: [[500, .1], [420, .14]],
      bad: [[220, .16], [170, .22]], nope: [[180, .1]], win: [[523, .12], [659, .12], [784, .12], [1047, .3]] }[kind] || [];
    let t = ac.currentTime;
    for (const [f, d] of notes) {
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = kind === 'bad' || kind === 'nope' ? 'square' : 'triangle'; o.frequency.value = f;
      v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(.12, t + .01); v.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
    }
  } catch (e) {}
}
function toggleMute() { muted = !muted; try { localStorage.setItem('ec-muted', muted ? '1' : '0'); } catch (e) {} render(); }
